<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>חיוג</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --btn:#1f7a3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111111; --fg:#f2f2f2; --btn:#2e9e50; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; }
  a { display:block; padding:22px 40px; border-radius:16px; background:var(--btn); color:#fff;
      font-size:28px; text-decoration:none; direction:ltr; }
</style>
</head>
<body>
<a id="dial" href="#">📞</a>
<script>
  // Tap-to-dial bridge for Kai's Telegram reminders: Telegram strips tel: links,
  // so the reminder links here and this page forwards to tel:<n>.
  var n = (new URLSearchParams(location.search).get('n') || '').replace(/[^0-9*#+]/g, '');
  var href = 'tel:' + n.replace(/#/g, '%23');
  var a = document.getElementById('dial');
  if (n) { a.href = href; a.textContent = '📞 ' + n; location.replace(href); }
</script>
</body>
</html>
