<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>חיוג</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#ffffff; --fg:#111111; --btn:#1f7a3a; --btn2:#2a6fdb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111111; --fg:#f2f2f2; --btn:#2e9e50; --btn2:#3d82ef; } }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; gap:18px; align-items:center;
         justify-content:center; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; }
  a { display:block; padding:22px 40px; border-radius:16px; background:var(--btn); color:#fff;
      font-size:28px; text-decoration:none; direction:ltr; text-align:center; }
  #back { display:none; background:var(--btn2); font-size:20px; padding:16px 28px; direction:rtl; }
</style>
</head>
<body>
<a id="dial" href="#">📞</a>
<a id="back" href="#">חזרה לצ'אט</a>
<div id="dbg" style="position:fixed;bottom:6px;left:6px;right:6px;font-size:11px;opacity:.55;direction:ltr;text-align:left;word-break:break-all;"></div>
<script>
  // Loader: the dial logic lives in call.js, fetched with a fresh query every time so a cached
  // call.html (GitHub Pages sends max-age=600; Telegram's webview keeps it) never runs old code.
  window.CALL_VER = '2026-10-20b';
  document.write('<script src="call.js?t=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
